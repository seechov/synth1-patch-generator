[package]
name = "seechov-forge"
version = "2.0.0"
edition = "2021"
authors = ["Aleksei Sychev <seechov@protonmail.com>"]
description = "Synth1 VST preset generator powered by a WGAN-GP neural network"
license = "MIT"

[[bin]]
name = "seechov-forge"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust ONNX runtime — no external DLLs needed, works on Windows + Linux
tract-onnx = "0.21"
rfd = "0.14"
rand = "0.8"
rand_distr = "0.4"
zip = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[package.metadata.deb]
maintainer = "Aleksei Sychev <seechov@protonmail.com>"
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
  ["target/release/seechov-forge", "usr/bin/seechov-forge", "755"],
  ["assets/seechov-forge.desktop", "usr/share/applications/seechov-forge.desktop", "644"],
  ["assets/seechov-forge.png", "usr/share/icons/hicolor/256x256/apps/seechov-forge.png", "644"],
  ["../installer/trained-model/generator.onnx", "usr/share/seechov-forge/model/generator.onnx", "644"],
  ["../installer/trained-model/normalization.json", "usr/share/seechov-forge/model/normalization.json", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/seechov-forge", dest = "/usr/bin/seechov-forge", mode = "755" },
  { source = "assets/seechov-forge.desktop", dest = "/usr/share/applications/seechov-forge.desktop", mode = "644" },
  { source = "assets/seechov-forge.png", dest = "/usr/share/icons/hicolor/256x256/apps/seechov-forge.png", mode = "644" },
  { source = "../installer/trained-model/generator.onnx", dest = "/usr/share/seechov-forge/model/generator.onnx", mode = "644" },
  { source = "../installer/trained-model/normalization.json", dest = "/usr/share/seechov-forge/model/normalization.json", mode = "644" },
]
