[package]
name = "synth1gan"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "synth1gan"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust ONNX runtime — no external DLLs needed, works on Windows + Linux
tract-onnx = "0.21"
rfd = "0.14"
rand = "0.8"
rand_distr = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
